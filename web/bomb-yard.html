<style>
/* Layout: one arcade cabinet column. Arena screen in the middle, a player card on each side, controls below. */
:root {
  --night: #10162b;      /* cabinet body, deeper than PICO-8 dark blue */
  --panel: #1a2342;      /* card and bezel fill */
  --line: #2c3a66;       /* hairlines */
  --ink: #fff1e8;        /* PICO-8 white */
  --muted: #8e98bd;      /* captions */
  --p1: #fff1e8;         /* player 1 suit */
  --p2: #ff004d;         /* player 2 suit, PICO-8 red */
  --spark: #ffec27;      /* fuse yellow, the one accent */
  --display: "Silkscreen", "Courier New", monospace;
  --body: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font: 14px/1.5 var(--body);
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.cab { max-width: 880px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 700 clamp(28px, 6vw, 44px)/1 var(--display); margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
h1 span { color: var(--spark); }
.cart { font: 12px var(--body); color: var(--muted); }
.lvl { font: 700 14px var(--display); letter-spacing: 0.06em; color: var(--night); background: var(--spark); padding: 4px 8px; border-radius: 3px; }
.lvl.debug { background: var(--p2); color: var(--ink); }
button.dbg { background: var(--panel); color: var(--muted); box-shadow: none; border: 1px dashed var(--line); font-size: 12px; }
.cart b { color: var(--ink); font-weight: 600; }

.stage { display: grid; grid-template-columns: 1fr minmax(0, 512px) 1fr; gap: 16px; align-items: start; }
.screen { position: relative; aspect-ratio: 1; width: 100%; max-width: 100%; background: #000; border: 6px solid var(--panel); outline: 1px solid var(--line); border-radius: 4px; }
canvas#game { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: grid; gap: 10px; }
.card h2 { margin: 0; font: 700 16px/1 var(--display); letter-spacing: 0.04em; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card[data-p="1"] h2 { color: var(--p1); }
.card[data-p="2"] h2 { color: var(--p2); }
.card .who { font: 11px var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.pips { display: flex; gap: 5px; }
.pip { width: 12px; height: 12px; border: 2px solid var(--line); background: transparent; }
.pip.on { background: var(--spark); border-color: var(--spark); }
.stats { display: grid; gap: 6px; margin: 0; }
.stat { display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 8px; }
.stat canvas { width: 24px; height: 24px; image-rendering: pixelated; }
.stat dt { font-size: 12px; color: var(--muted); }
.stat dd { margin: 0; font: 700 14px var(--display); font-variant-numeric: tabular-nums; }
.keys { font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
kbd { font: 600 11px var(--body); color: var(--ink); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--night); }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(16, 22, 43, 0.78); text-align: center; padding: 16px; }
.overlay .box { display: grid; gap: 14px; justify-items: center; }
.overlay .big { font: 700 clamp(20px, 5vw, 32px)/1.1 var(--display); text-wrap: balance; margin: 0; }
.overlay .sub { margin: 0; color: var(--muted); font-size: 12px; max-width: 32ch; }
.modes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button { font: 700 14px var(--display); letter-spacing: 0.04em; color: var(--night); background: var(--spark); border: 0; border-radius: 3px; padding: 10px 14px; cursor: pointer; box-shadow: 0 3px 0 #b39a00; }
button.alt { background: var(--ink); box-shadow: 0 3px 0 #a9a3a0; }
button:active { transform: translateY(2px); box-shadow: 0 1px 0 #b39a00; }
button:focus-visible { outline: 3px solid var(--p2); outline-offset: 3px; }
.bar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.bar button { font-size: 11px; padding: 6px 10px; background: var(--panel); color: var(--ink); box-shadow: none; border: 1px solid var(--line); }

.pad { display: none; justify-content: space-between; align-items: center; gap: 16px; user-select: none; -webkit-user-select: none; touch-action: none; }
.dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
.dpad div, .bombbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; color: var(--muted); font: 700 18px var(--display); }
.dpad .on, .bombbtn.on { background: var(--line); color: var(--ink); }
.bombbtn { width: 84px; height: 84px; border-radius: 50%; color: var(--spark); font-size: 14px; }
@media (pointer: coarse) { .pad { display: flex; } }

@media (max-width: 760px) {
  .stage { grid-template-columns: 1fr 1fr; }
  .screen { grid-column: 1 / -1; order: -1; }
  .keys { display: none; }
}
/* Touch screens: arena + pad must fit on one screen without scrolling.
   Order: title, arena, pad, then player cards and menu bar below. */
@media (pointer: coarse) {
  body { padding-block: 8px 16px; }
  .cab { grid-template-columns: 1fr 1fr; gap: 10px; }
  .cab > header, .screen, .cab > .pad, .cab > .bar { grid-column: 1 / -1; }
  .stage { display: contents; }
  header { order: 0; }
  h1 { font-size: 22px; }
  .cart { display: none; }
  .screen {
    order: 1; justify-self: center; border-width: 4px;
    width: min(100%, calc(100vh - 290px));
    width: min(100%, calc(100svh - 290px));
  }
  .pad { order: 2; }
  .card[data-p="1"] { order: 3; }
  .card[data-p="2"] { order: 4; }
  .bar { order: 5; }
  .card { padding: 8px; gap: 6px; }
  .keys { display: none; }
  .dpad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); }
  .bombbtn { width: 80px; height: 80px; }

  /* Two players on one phone: P2's pad sits above the arena, turned to face
     a player sitting opposite. Pads shrink so both fit with the arena. */
  .pad.p2 { order: 0; transform: rotate(180deg); }
  body.two header { display: none; }
  body.two .screen { width: min(100%, calc(100vh - 360px)); width: min(100%, calc(100svh - 360px)); }
  body.two .dpad { grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); }
  body.two .bombbtn { width: 68px; height: 68px; font-size: 12px; }
}
.pad.p2 .bombbtn { color: var(--p2); }
body:not(.two) .pad.p2 { display: none; }
@media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>

<div class="cab">
  <header>
    <h1>BOMB <span>YARD</span></h1>
    <div class="lvl" id="lvl" hidden></div>
    <div class="cart">from your cart <b>bomb.p8</b> · same sprites, same map</div>
  </header>

  <div class="stage">
    <section class="card" data-p="1" aria-label="Player 1">
      <h2>P1 <div class="pips" id="pips1"></div></h2>
      <div class="who" id="who1">You</div>
      <dl class="stats" id="stats1"></dl>
      <div class="keys" id="keys1"></div>
    </section>

    <div class="screen">
      <canvas id="game" width="256" height="256" aria-label="Game arena"></canvas>
      <div class="overlay" id="overlay">
        <div class="box">
          <p class="big" id="ovTitle">BOMB YARD</p>
          <p class="sub" id="ovSub">Blow up the stone, grab the power-ups, catch the other player in your blast. First to 3 rounds wins.</p>
          <div class="modes" id="ovModes">
            <button id="btnCpu" type="button">1P vs monsters</button>
            <button id="btn2p" type="button" class="alt">2 players</button>
            <button id="btnDebug" type="button" class="dbg">Debug</button>
          </div>
        </div>
      </div>
    </div>

    <section class="card" data-p="2" aria-label="Player 2">
      <h2>P2 <div class="pips" id="pips2"></div></h2>
      <div class="who" id="who2">CPU</div>
      <dl class="stats" id="stats2"></dl>
      <div class="keys" id="keys2"></div>
    </section>
  </div>

  <!-- P2's pad is rotated 180°, so each arrow sends the opposite direction:
       "up" for a player sitting across the table is down on the arena. -->
  <div class="pad p2" data-p="1">
    <div class="dpad">
      <span></span><div data-d="d">▲</div><span></span>
      <div data-d="r">◀</div><span></span><div data-d="l">▶</div>
      <span></span><div data-d="u">▼</div><span></span>
    </div>
    <div class="bombbtn">BOMB</div>
  </div>

  <div class="pad" id="pad" data-p="0">
    <div class="dpad">
      <span></span><div data-d="u">▲</div><span></span>
      <div data-d="l">◀</div><span></span><div data-d="r">▶</div>
      <span></span><div data-d="d">▼</div><span></span>
    </div>
    <div class="bombbtn" id="padBomb">BOMB</div>
  </div>

  <div class="bar">
    <span id="status">Pick a mode to start.</span>
    <span style="display:flex;gap:8px">
      <button type="button" id="btnMute">Sound: on</button>
      <button type="button" id="btnMenu">Menu</button>
    </span>
  </div>
</div>

const N = 16;   // arena is N×N cells of 16px (twice each way of the cart's 8×8)

// ---------- PICO-8 palette & sprite sheet ----------
const PAL = ["#000000","#1d2b53","#7e2553","#008751","#ab5236","#5f574f","#c2c3c7","#fff1e8",

const TRANSP = 12;
function rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

  const c = document.createElement("canvas"); c.width = 128; c.height = 64;
  const x = c.getContext("2d"), img = x.createImageData(128, 64);
  for (let i = 0; i < 128*64; i++) {
    const col = parseInt(GFX[i], 16);
    if (col === transp) continue;
    const [r,g,b] = rgb(PAL[remap && remap[col] !== undefined ? remap[col] : col]);
    img.data.set([r,g,b,255], i*4);
  }
  x.putImageData(img, 0, 0); return c;

const SHEET = buildSheet();
const SHEET_RED = buildSheet({7:8, 6:8, 13:8});   // same recolor as the cart's player 2
const FLASH = {}; for (let i = 0; i < 16; i++) FLASH[i] = 7;
const SHEET_FLASH = buildSheet(FLASH);
// the cart's creature sprite (78) sits on a pink background, so pink is its see-through colour
const SHEET_MON = buildSheet(null, 14), SHEET_MON_FLASH = buildSheet(FLASH, 14);

const cv = document.getElementById("game"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
function spr(sheet, n, x, y, w = 1, h = 1, flip = false, c = ctx){
  const sx = (n % 16) * 8, sy = Math.floor(n / 16) * 8;
  if (!flip) { c.drawImage(sheet, sx, sy, w*8, h*8, Math.round(x), Math.round(y), w*8, h*8); return; }

  c.drawImage(sheet, sx, sy, w*8, h*8, 0, 0, w*8, h*8); c.restore();

// ---------- background music ----------

// and goes up in key and tempo with each level.
const LEAD = [69,0,72,0,76,0,74,72, 69,0,67,0,69,0,0,0, 72,0,76,0,79,0,77,76, 74,0,72,0,74,0,0,0,
              69,0,72,0,76,0,79,0, 81,0,79,76,74,0,72,0, 74,0,72,0,69,0,67,0, 69,0,0,0,0,0,0,0];
const BASS = [45,52,41,48,43,50,45,52, 45,52,41,48,43,50,45,45];   // one note per 8th (2 steps)
let musicStep = 0, musicNext = 0;
function midiHz(n){ return 440 * Math.pow(2, (n - 69) / 12); }
function note(a, n, t, dur, type, vol){
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = midiHz(n);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
setInterval(() => {
  if (!ac || ac.state !== "running") return;
  const playing = !muted && (phase === "play" || phase === "roundover") && mode;
  if (!playing) { musicNext = 0; return; }
  const lv = mode === "cpu" ? level : 1;
  const stress = G && G.time <= STRESS_TIME && phase === "play";
  const shift = [0, 2, 5][lv - 1] + (stress ? 1 : 0);
  const step = 60 / ((132 + (lv - 1) * 12) * (stress ? 1.4 : 1)) / 4;
  if (musicNext < ac.currentTime) musicNext = ac.currentTime + 0.05;
  while (musicNext < ac.currentTime + 0.25) {
    const l = LEAD[musicStep % LEAD.length];
    if (l) note(ac, l + shift, musicNext, step * 1.8, "square", 0.025);
    if (musicStep % 2 === 0) note(ac, BASS[(musicStep / 2) % BASS.length] + shift, musicNext, step * 1.9, "triangle", 0.06);
    else if (stress) note(ac, BASS[((musicStep - 1) / 2) % BASS.length] + shift + 12, musicNext, step * 0.9, "triangle", 0.05);   // driving off-beat bass
    if (stress && musicStep % 4 === 0) note(ac, 96, musicNext, 0.03, "square", 0.02);                                         // clock tick on every beat
    musicStep++; musicNext += step;
  }
}, 50);

// ---------- game state ----------
let G = null;            // current round
let mode = null;         // "cpu" | "2p"
let wins = [0, 0];
let level = 1;           // 1-player level, 1..LEVELS.length
let debug = false;       // debug mode: player 1 walks through walls
let carry = null;        // player 1's power-ups, kept from level to level
let phase = "menu";      // menu | play | roundover | matchover | paused

function cellType(cx, cy){ const t = G.tiles[cy*2][cx*2]; return t === CEMENT ? "cement" : t === STONE ? "stone" : "floor"; }
function setCellTiles(cx, cy, t){ for (let oy = 0; oy < 2; oy++) for (let ox = 0; ox < 2; ox++) G.tiles[cy*2+oy][cx*2+ox] = t; }
function bombAt(cx, cy){ return G.bombs.find(b => b.cx === cx && b.cy === cy); }
function flameAt(cx, cy){ return G.flames.find(f => f.cx === cx && f.cy === cy); }
function pickupAt(cx, cy){ return G.pickups.find(p => p.cx === cx && p.cy === cy); }
function walkable(cx, cy){ return cx >= 0 && cy >= 0 && cx < N && cy < N && cellType(cx, cy) === "floor" && !bombAt(cx, cy); }

function makePlayer(id, cx, cy, cpu){
  return { id, cx, cy, x: cx*16, y: cy*16, moving: false, dx: 0, dy: 0, left: 0,
           dir: "d", frame: 0, animT: 0, speed: 1, speedUps: 0, fire: 1, bombs: 1, active: 0,
           alive: true, deathT: 0, pending: false, cpu, wait: 0 };
}

// Random arena: cement border, a grid of cement pillars, stone scattered over the rest.
// Each player's corner and the two cells beside it stay clear so nobody starts boxed in.
function randomMap(){
  const tiles = Array.from({ length: N*2 }, () => new Array(N*2).fill(GRASS));
  const put = (cx, cy, base) => { tiles[cy*2][cx*2] = base; tiles[cy*2][cx*2+1] = base+1; tiles[cy*2+1][cx*2] = base+16; tiles[cy*2+1][cx*2+1] = base+17; };
  const safe = new Set();
  for (const [x, y] of [[1,1],[2,1],[1,2],[3,1],[1,3]])
    for (const [ax, ay] of [[x, y], [N-1-x, y], [x, N-1-y], [N-1-x, N-1-y]]) safe.add(ax + ay*N);
  for (let cy = 0; cy < N; cy++) for (let cx = 0; cx < N; cx++) {
    const edge = cx === 0 || cy === 0 || cx === N-1 || cy === N-1;
    const pillar = cx % 2 === 0 && cy % 2 === 0 && cx < N-2 && cy < N-2;
    if (edge || pillar) put(cx, cy, CEMENT);
    else if (!safe.has(cx + cy*N) && Math.random() < 0.6) put(cx, cy, STONE);
    else if (Math.random() < 0.25) put(cx, cy, GRASS);   // the cart's grass with tufts
  }
  return tiles;
}

function newRound(){
  G = { tiles: randomMap(), bombs: [], flames: [], pickups: [], t: 0 };
  // in 2-player mode P1 starts in the bottom corner, near the bottom pad, and P2 near the top pad
  if (mode === "2p") {
    G.players = [makePlayer(0, N-2, N-2, false), makePlayer(1, 1, 1, false)];
    G.monsters = [];
  } else {
    // 1-player: you against two monsters starting in the far corners
    G.players = [makePlayer(0, 1, 1, false)];
    if (carry) Object.assign(G.players[0], carry);
    const speed = LEVELS[level - 1].monsterSpeed;
    G.monsters = [[N-2, N-2], [N-2, 1], [1, N-2]].slice(0, MONSTER_COUNT).map(([cx, cy]) => makeMonster(cx, cy, speed));
  }
  G.confetti = [];
  G.time = ROUND_TIME; G.timeUp = false;
  renderHud();
}

// ---------- monsters ----------
function makeMonster(cx, cy, speed){
  return { speed, cx, cy, x: cx*16, y: cy*16, moving: false, dx: 0, dy: 0, left: 0, dir: "l", alive: true, deathT: 0, wait: 0, bob: 0 };
}
// wander the open floor: keep going straight most of the time, turn at junctions,
// only turn back at a dead end, and never step into fire
function monsterPick(m){
  const back = { l: "r", r: "l", u: "d", d: "u" }[m.dir];
  const open = Object.keys(DIRS).filter(d => {
    const [dx, dy] = DIRS[d], x = m.cx + dx, y = m.cy + dy;
    return walkable(x, y) && !flameAt(x, y);
  });
  if (!open.length) return null;
  const fwd = open.filter(d => d !== back);
  if (!fwd.length) return back;
  if (fwd.includes(m.dir) && Math.random() < 0.7) return m.dir;
  return fwd[Math.floor(Math.random() * fwd.length)];
}
function updateMonster(m){
  if (!m.alive) { if (m.deathT > 0) m.deathT--; return; }
  m.bob++;
  if (!m.moving) {
    if (m.wait > 0) { m.wait--; return; }
    const d = monsterPick(m);
    if (!d) { m.wait = 20; return; }
    m.dir = d; [m.dx, m.dy] = DIRS[d]; m.moving = true; m.left = 16;
  }
  const s = Math.min(m.speed, m.left);
  m.x += m.dx * s; m.y += m.dy * s; m.left -= s;
  if (m.left <= 0) {
    m.moving = false; m.cx = Math.round(m.x/16); m.cy = Math.round(m.y/16); m.x = m.cx*16; m.y = m.cy*16;
    if (Math.random() < 0.1) m.wait = 10 + Math.floor(Math.random()*30);   // stop and look around now and then
  }
}

function placeBomb(p){
  if (!p.alive || p.active >= p.bombs || bombAt(p.cx, p.cy)) return false;
  G.bombs.push({ cx: p.cx, cy: p.cy, fuse: FUSE, owner: p, range: p.fire });
  p.active++; SFX.place(); return true;
}

function addFlame(cx, cy){
  const f = flameAt(cx, cy);
  if (f) f.t = FLAME_TIME; else G.flames.push({ cx, cy, t: FLAME_TIME });
  const pk = pickupAt(cx, cy);
  if (pk && !pk.fresh) G.pickups.splice(G.pickups.indexOf(pk), 1);
}

function explode(b){
  const i = G.bombs.indexOf(b); if (i < 0) return;
  G.bombs.splice(i, 1); b.owner.active = Math.max(0, b.owner.active - 1);
  if (!boomedThisFrame) { boom(); boomedThisFrame = true; }
  addFlame(b.cx, b.cy);
  for (const [dx, dy] of Object.values(DIRS)) {
    for (let n = 1; n <= b.range; n++) {
      const cx = b.cx + dx*n, cy = b.cy + dy*n, t = cellType(cx, cy);
      if (t === "cement") break;
      if (t === "stone") {
        setCellTiles(cx, cy, GRASS);
        const types = ["shoe", "fire", "bomb"];
        G.pickups.push({ cx, cy, type: types[Math.floor(Math.random()*3)], fresh: true });
        addFlame(cx, cy);
        break;                                 // stone stops the blast
      }
      addFlame(cx, cy);
      const other = bombAt(cx, cy);
      if (other) explode(other);               // chain reaction
    }
  }
}

function collect(p){
  const pk = pickupAt(p.cx, p.cy); if (!pk) return;
  G.pickups.splice(G.pickups.indexOf(pk), 1);
  if (pk.type === "shoe" && p.speedUps < MAX_SPEEDUPS) { p.speedUps++; p.speed = 1 + p.speedUps * SPEED_STEP; }
  if (pk.type === "fire") p.fire++;
  if (pk.type === "bomb") p.bombs++;
  SFX.pickup(); renderHud();
}

function tryStep(p, d){
  if (!d) { p.frame = 0; p.animT = 0; return; }
  p.dir = d;
  const [dx, dy] = DIRS[d];
  const nx = p.cx + dx, ny = p.cy + dy;
  const ghost = debug && p.id === 0 && nx >= 0 && ny >= 0 && nx < N && ny < N;
  if (ghost || walkable(nx, ny)) { p.moving = true; p.dx = dx; p.dy = dy; p.left = 16; }
}

function updatePlayer(p){
  if (!p.alive) { if (p.deathT > 0) p.deathT--; return; }
  if (!p.moving) {
    if (p.pending) { placeBomb(p); p.pending = false; }
    // a tap always moves one cell, even if released before the next frame
    tryStep(p, p.cpu ? cpuThink(p) : (humanDir(p.id) || tap[p.id]));
    tap[p.id] = null;
  }
  if (p.moving) {
    const s = Math.min(p.speed, p.left);
    p.x += p.dx * s; p.y += p.dy * s; p.left -= s;
    if (++p.animT >= 8) { p.animT = 0; p.frame = (p.frame + 1) % 4; }
    if (p.left <= 0) {
      p.moving = false; p.cx = Math.round(p.x/16); p.cy = Math.round(p.y/16); p.x = p.cx*16; p.y = p.cy*16;
      collect(p);
      if (p.pending) { placeBomb(p); p.pending = false; }
      tryStep(p, p.cpu ? cpuThink(p) : humanDir(p.id));   // keep walking without a stall frame
    }
  }
}

function tick(){
  boomedThisFrame = false;
  G.t++;
  for (const p of G.players) updatePlayer(p);
  for (const m of G.monsters) updateMonster(m);
  for (const b of [...G.bombs]) if (--b.fuse <= 0) explode(b);
  for (let i = G.flames.length - 1; i >= 0; i--) if (--G.flames[i].t <= 0) G.flames.splice(i, 1);
  for (const p of G.players) {
    if (!p.alive) continue;
    if (flameAt(Math.round(p.x/16), Math.round(p.y/16))) { p.alive = false; p.deathT = 60; SFX.die(); }
  }
  for (const m of G.monsters) {
    if (!m.alive) continue;
    if (flameAt(Math.round(m.x/16), Math.round(m.y/16))) { m.alive = false; m.deathT = 40; SFX.pickup(); renderHud(); continue; }
    for (const p of G.players)
      if (p.alive && Math.abs(p.x - m.x) < 11 && Math.abs(p.y - m.y) < 11) { p.alive = false; p.deathT = 60; SFX.die(); }
  }
  for (const pk of G.pickups) pk.fresh = false;

  // the clock: when it hits zero the arena is lost. 1-player dies, 2-player is a draw
  if (phase === "play" && G.time > 0 && --G.time === 0) {
    G.timeUp = true; SFX.die();
    for (const p of G.players) if (p.alive) { p.alive = false; p.deathT = 60; }
  }

  if (phase === "play" && mode === "cpu") {
    const p = G.players[0];
    if (!p.alive && p.deathT <= 0) soloDied();
    else if (p.alive && G.monsters.every(m => !m.alive && m.deathT <= 0)) soloCleared(p);
  } else if (phase === "play") {
    const alive = G.players.filter(p => p.alive);
    const dying = G.players.some(p => !p.alive && p.deathT > 0);
    if (alive.length <= 1 && !dying) endRound(alive[0]);
  }
}

// ---------- 1-player levels ----------
function soloDied(){
  phase = "roundover";
  showOverlay(G.timeUp ? "Time's up" : "The monsters got you", `Try level ${level} again. Starting in a moment.`, null);
  setTimeout(() => { if (phase === "roundover") { newRound(); hideOverlay(); phase = "play"; } }, 1800);
}
function soloCleared(p){
  carry = { speed: p.speed, speedUps: p.speedUps, fire: p.fire, bombs: p.bombs };
  if (level >= LEVELS.length) {
    phase = "victory"; SFX.win(); renderHud();
    for (let i = 0; i < 90; i++) G.confetti.push({ x: Math.random()*N*16, y: -Math.random()*N*16, vy: 0.6 + Math.random(), vx: Math.random() - 0.5, c: [8, 9, 10, 11, 12, 14][i % 6] });
    showOverlay("Congratulations!", `You beat all ${LEVELS.length} levels and cleared every monster. You win!`, "victory");
    return;
  }
  level++; phase = "roundover"; SFX.win(); renderHud();
  showOverlay(`Level ${level - 1} cleared`, `Next up: level ${level}, ${LEVELS[level - 1].name}. The monsters are faster now.`, null);
  setTimeout(() => { if (phase === "roundover") { newRound(); hideOverlay(); phase = "play"; renderHud(); } }, 2200);
}

function endRound(winner){
  let title, sub;
  if (winner) {
    wins[winner.id]++;
    title = mode === "cpu" ? (winner.id === 0 ? "You cleared the yard" : "The monsters got you") : `${playerName(winner.id)} wins the round`;
  } else title = G.timeUp ? "Time's up. Nobody scores" : "Draw. Nobody scores";
  if (winner && wins[winner.id] >= WINS_NEEDED) {
    phase = "matchover"; SFX.win();
    showOverlay(mode === "cpu" ? (winner.id === 0 ? "You win the match" : "The monsters win") : `${playerName(winner.id)} wins the match`, `${wins[0]}–${wins[1]}. Press Enter or Space for a rematch.`, "rematch");
  } else {
    phase = "roundover";
    sub = `Score ${wins[0]}–${wins[1]}. Next round starts in a moment.`;
    showOverlay(title, sub, null);
    setTimeout(() => { if (phase === "roundover") { newRound(); hideOverlay(); phase = "play"; } }, 1800);
  }
  renderHud();
}
function playerName(id){ return id === 0 ? "Player 1" : (mode === "cpu" ? "Monsters" : "Player 2"); }

// ---------- CPU ----------
function blastCells(cx, cy, range){
  const out = [[cx, cy]];
  for (const [dx, dy] of Object.values(DIRS)) for (let n = 1; n <= range; n++) {
    const x = cx + dx*n, y = cy + dy*n, t = cellType(x, y);
    if (t === "cement") break;
    out.push([x, y]);
    if (t === "stone") break;
  }
  return out;
}
// frames until each cell burns (0 = burning now); chained bombs inherit the earliest fuse
function dangerMap(extra){
  const bombs = G.bombs.map(b => ({ cx: b.cx, cy: b.cy, range: b.range, t: b.fuse }));
  if (extra) bombs.push(extra);
  for (let pass = 0; pass < 3; pass++) for (const b of bombs)
    for (const [x, y] of blastCells(b.cx, b.cy, b.range)) {
      const o = bombs.find(c => c.cx === x && c.cy === y);
      if (o && o.t > b.t) o.t = b.t;
    }
  const m = new Map();
  for (const b of bombs) for (const [x, y] of blastCells(b.cx, b.cy, b.range)) {
    const k = x + y*N; m.set(k, Math.min(m.get(k) ?? 1e9, b.t));
  }
  for (const f of G.flames) m.set(f.cx + f.cy*N, 0);
  return m;
}
// breadth-first search; returns the first direction toward the nearest cell passing goal()
function bfs(p, danger, goal, allowDanger){
  const fpc = 16 / p.speed, start = p.cx + p.cy*N;
  const seen = new Set([start]), q = [[p.cx, p.cy, 0, null]];
  while (q.length) {
    const [x, y, steps, first] = q.shift();
    if (steps > 0 && goal(x, y)) return first;
    for (const [d, [dx, dy]] of Object.entries(DIRS)) {
      const nx = x + dx, ny = y + dy, k = nx + ny*N;
      if (seen.has(k) || !walkable(nx, ny)) continue;
      const dt = danger.get(k);
      if (dt !== undefined) {
        if (!allowDanger) continue;
        const arrive = (steps + 1) * fpc;
        if (dt <= arrive + fpc + 4) continue;       // would still be standing there when it blows
      }
      seen.add(k); q.push([nx, ny, steps + 1, first || d]);
    }
  }
  return null;
}
function canEscape(p, danger){
  return bfs(p, danger, (x, y) => !danger.has(x + y*N), true) !== null;
}
function cpuThink(p){
  if (p.wait > 0) { p.wait--; return null; }
  const foe = G.players.find(o => o !== p && o.alive);
  const danger = dangerMap();
  const here = p.cx + p.cy*N;

  if (danger.has(here)) return bfs(p, danger, (x, y) => !danger.has(x + y*N), true);

  // drop a bomb if it would hit stone or the opponent, and there is a way out
  if (p.active < p.bombs && !bombAt(p.cx, p.cy)) {
    const cells = blastCells(p.cx, p.cy, p.fire);
    const hitsStone = cells.some(([x, y]) => cellType(x, y) === "stone");
    const hitsFoe = foe && cells.some(([x, y]) => Math.abs(foe.x/16 - x) < 0.6 && Math.abs(foe.y/16 - y) < 0.6);
    if ((hitsStone || hitsFoe) && Math.random() < 0.9) {
      const hyp = dangerMap({ cx: p.cx, cy: p.cy, range: p.fire, t: FUSE });
      if (canEscape(p, hyp)) { placeBomb(p); p.wait = 2; return bfs(p, hyp, (x, y) => !hyp.has(x + y*N), true); }
    }
  }

  // otherwise walk somewhere useful, never into a blast zone
  const hasPickups = G.pickups.length > 0;
  let d = hasPickups ? bfs(p, danger, (x, y) => pickupAt(x, y), false) : null;
  if (!d) d = bfs(p, danger, (x, y) => {
    if (bombAt(x, y)) return false;
    const cells = blastCells(x, y, p.fire);
    if (cells.some(([a, b]) => cellType(a, b) === "stone")) return true;
    return foe && cells.some(([a, b]) => a === foe.cx && b === foe.cy);
  }, false);
  if (!d && foe) d = bfs(p, danger, (x, y) => Math.abs(x - foe.cx) + Math.abs(y - foe.cy) <= 1, false);
  if (!d) { p.wait = 10 + Math.floor(Math.random()*20); return null; }
  if (Math.random() < 0.08) p.wait = 6 + Math.floor(Math.random()*12);   // a little hesitation keeps it beatable
  return d;
}

// ---------- input ----------
const held = new Set();
const order = [[], []];        // most recent direction wins, per player
const BIND = {
  "2p": [
    { l: ["KeyA"], r: ["KeyD"], u: ["KeyW"], d: ["KeyS"], b: ["Space", "KeyF", "KeyQ"] },
    { l: ["ArrowLeft"], r: ["ArrowRight"], u: ["ArrowUp"], d: ["ArrowDown"], b: ["Enter", "Slash", "ShiftRight", "Period"] },
  ],
  cpu: [
    { l: ["ArrowLeft", "KeyA"], r: ["ArrowRight", "KeyD"], u: ["ArrowUp", "KeyW"], d: ["ArrowDown", "KeyS"], b: ["Space", "KeyX", "KeyZ", "Enter"] },
    null,
  ],
};
function bindFor(id){ return BIND[mode || "cpu"][id]; }
function humanDir(id){
  const o = order[id];
  for (let i = o.length - 1; i >= 0; i--) return o[i];
  return null;
}
const tap = [null, null];
function pressDir(id, d){ tap[id] = d; const o = order[id]; const i = o.indexOf(d); if (i >= 0) o.splice(i, 1); o.push(d); }
function releaseDir(id, d){ const o = order[id]; const i = o.indexOf(d); if (i >= 0) o.splice(i, 1); }
function pressBomb(id){ if (phase === "play" && G) { const p = G.players[id]; if (p && p.alive && !p.cpu) p.pending = true; } }

addEventListener("keydown", e => {
  audio();
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if (phase === "menu") { if (e.code === "Enter" || e.code === "Space") start("cpu"); return; }
  if (phase === "matchover" || phase === "victory") { if (e.code === "Enter" || e.code === "Space") start(mode); return; }
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); return; }
  if (e.code === "KeyM") { toggleMute(); return; }
  if (e.repeat) return;
  for (const id of [0, 1]) {
    const b = bindFor(id); if (!b) continue;
    for (const d of ["l","r","u","d"]) if (b[d].includes(e.code)) pressDir(id, d);
    if (b.b.includes(e.code)) pressBomb(id);
  }
});
addEventListener("keyup", e => {
  for (const id of [0, 1]) {
    const b = bindFor(id); if (!b) continue;
    for (const d of ["l","r","u","d"]) if (b[d].includes(e.code)) releaseDir(id, d);
  }
});
addEventListener("blur", () => { order[0].length = 0; order[1].length = 0; });

// touch pads: the bottom one drives player 1, the top one (2-player mode) player 2
document.querySelectorAll(".pad").forEach(pad => {
  const id = +pad.dataset.p;
  pad.querySelectorAll(".dpad [data-d]").forEach(el => {
    const d = el.dataset.d;
    el.addEventListener("pointerdown", e => { e.preventDefault(); audio(); el.classList.add("on"); pressDir(id, d); });
    const up = () => { el.classList.remove("on"); releaseDir(id, d); };
    el.addEventListener("pointerup", up); el.addEventListener("pointerleave", up); el.addEventListener("pointercancel", up);
  });
  const bomb = pad.querySelector(".bombbtn");
  bomb.addEventListener("pointerdown", e => { e.preventDefault(); audio(); bomb.classList.add("on"); pressBomb(id); });
  const off = () => bomb.classList.remove("on");
  bomb.addEventListener("pointerup", off); bomb.addEventListener("pointercancel", off);
});

// ---------- UI ----------
const overlay = document.getElementById("overlay");
const ovTitle = document.getElementById("ovTitle"), ovSub = document.getElementById("ovSub"), ovModes = document.getElementById("ovModes");
const statusEl = document.getElementById("status");
function showOverlay(title, sub, buttons){
  ovTitle.textContent = title; ovSub.textContent = sub;
  ovModes.hidden = !buttons;
  btnDebug.hidden = buttons !== "menu";
  if (buttons === "victory") { btnCpu.textContent = "Play again"; btn2p.textContent = "2 players"; }
  else if (buttons === "rematch") { btnCpu.textContent = mode === "cpu" ? "Rematch" : "1P vs monsters"; btn2p.textContent = mode === "2p" ? "Rematch" : "2 players"; }
  else if (buttons) { btnCpu.textContent = "1P vs monsters"; btn2p.textContent = "2 players"; }
  overlay.hidden = false;
}
function hideOverlay(){ overlay.hidden = true; }
const btnCpu = document.getElementById("btnCpu"), btn2p = document.getElementById("btn2p"), btnDebug = document.getElementById("btnDebug");
btnCpu.addEventListener("click", () => start("cpu"));
btnDebug.addEventListener("click", () => start("cpu", true));
btn2p.addEventListener("click", () => start("2p"));
document.getElementById("btnMenu").addEventListener("click", () => {
  document.body.classList.remove("two");
  phase = "menu"; showOverlay("BOMB YARD", "Blow up the stone, grab the power-ups, catch the other player in your blast. First to 3 rounds wins.", "menu");
  statusEl.textContent = "Pick a mode to start.";
});
const btnMute = document.getElementById("btnMute");
function toggleMute(){ muted = !muted; btnMute.textContent = `Sound: ${muted ? "off" : "on"}`; }
btnMute.addEventListener("click", toggleMute);
overlay.addEventListener("click", e => { if (phase === "paused" && !e.target.closest("button")) togglePause(); });
function togglePause(){
  if (phase === "play") { phase = "paused"; showOverlay("Paused", "Press P or Esc to keep playing.", null); }
  else if (phase === "paused") { phase = "play"; hideOverlay(); }
}

function start(m, dbg = false){
  audio();
  mode = m; debug = m === "cpu" && dbg; level = 1; carry = null; wins = [0, 0]; order[0].length = 0; order[1].length = 0;
  document.body.classList.toggle("two", m === "2p");
  newRound(); hideOverlay(); phase = "play";
  statusEl.textContent = debug ? "Debug: you walk through walls · P or Esc pauses" : m === "cpu" ? "1P vs monsters · P or Esc pauses · M mutes" : "2 players · P or Esc pauses · M mutes";
  renderKeys(); renderHud();
}

function iconCanvas(n, sheet = SHEET){
  const c = document.createElement("canvas"); c.width = 16; c.height = 16;
  const x = c.getContext("2d"); x.imageSmoothingEnabled = false; spr(sheet, n, 0, 0, 2, 2, false, x); return c;
}
function renderHud(){
  const lvl = document.getElementById("lvl");
  lvl.hidden = mode !== "cpu";
  lvl.classList.toggle("debug", debug);
  lvl.textContent = debug ? `DEBUG · LEVEL ${level}/${LEVELS.length}` : `LEVEL ${level}/${LEVELS.length}`;
  for (const id of [0, 1]) {
    const p = (G && G.players[id]) || makePlayer(id, 0, 0, false);
    const monsters = id === 1 && mode !== "2p";
    // 1-player: P1's pips count cleared levels; 2-player: rounds won
    const solo = mode !== "2p";
    const filled = solo ? (id === 0 ? level - 1 + (phase === "victory" ? 1 : 0) : 0) : wins[id];
    document.getElementById("pips" + (id+1)).innerHTML = solo && id === 1 ? "" :
      Array.from({ length: solo ? LEVELS.length : WINS_NEEDED }, (_, i) => `<span class="pip${i < filled ? " on" : ""}"></span>`).join("");
    document.getElementById("who" + (id+1)).textContent = id === 0 ? (mode === "2p" ? "Human" : "You") : (mode === "2p" ? "Human" : "Monsters");
    const dl = document.getElementById("stats" + (id+1)); dl.innerHTML = "";
    const left = G && G.monsters ? G.monsters.filter(m => m.alive).length : MONSTER_COUNT;
    const rows = monsters
      ? [[MONSTER_SPR, "Monsters left", `${left}/${MONSTER_COUNT}`, SHEET_MON]]
      : [[BOMB_POWER_SPR, "Bombs", p.bombs], [FIRE_POWER_SPR, "Blast range", p.fire], [SHOE_SPR, "Speed", `${p.speedUps}/${MAX_SPEEDUPS}`]];
    for (const [spn, label, val, sheet] of rows) {
      const row = document.createElement("div"); row.className = "stat";
      row.append(iconCanvas(spn, sheet));
      row.insertAdjacentHTML("beforeend", `<dt>${label}</dt><dd>${val}</dd>`);
      dl.append(row);
    }
  }
}
function renderKeys(){
  const k = s => s.split(" ").map(x => `<kbd>${x}</kbd>`).join(" ");
  if (mode === "2p") {
    document.getElementById("keys1").innerHTML = `Move ${k("W A S D")}<br>Bomb ${k("Space")}`;
    document.getElementById("keys2").innerHTML = `Move ${k("← ↑ ↓ →")}<br>Bomb ${k("Enter")}`;
  } else {
    document.getElementById("keys1").innerHTML = `Move ${k("← ↑ ↓ →")} or ${k("WASD")}<br>Bomb ${k("Space")} or ${k("X")}`;
    document.getElementById("keys2").innerHTML = `Two monsters roam the yard. Touch one and you're out. Blast both to win the round.`;
  }
}

// ---------- draw ----------
function draw(){
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, N*16, N*16);
  const tiles = mode === "cpu" ? LEVEL_SHEETS[level - 1] : SHEET;
  for (let ty = 0; ty < N*2; ty++) for (let tx = 0; tx < N*2; tx++) spr(tiles, G.tiles[ty][tx], tx*8, ty*8);
  for (const pk of G.pickups) spr(SHEET, PICKUP_SPR[pk.type], pk.cx*16, pk.cy*16, 2, 2);
  for (const b of G.bombs) {
    const flash = b.fuse < 60 && Math.floor(b.fuse / 5) % 2 === 0;
    spr(flash ? SHEET_FLASH : SHEET, BOMB_SPR, b.cx*16, b.cy*16, 2, 2);
  }
  for (const f of G.flames) spr(SHEET, EXPLOSION_SPR, f.cx*16, f.cy*16, 2, 2);
  for (const m of G.monsters) {
    if (!m.alive && m.deathT <= 0) continue;
    if (!m.alive && Math.floor(m.deathT / 3) % 2) continue;
    const hop = m.moving && Math.floor(m.bob / 8) % 2 ? -1 : 0;   // a little waddle while walking
    spr(m.alive ? SHEET_MON : SHEET_MON_FLASH, MONSTER_SPR, m.x, m.y + hop, 2, 2, m.dir === "r");
  }
  const ps = [...G.players].sort((a, b) => a.y - b.y);
  for (const p of ps) {
    if (!p.alive && p.deathT <= 0) continue;
    const a = ANIM[p.dir], fr = p.moving ? p.frame : 0;
    let sheet = p.id === 1 ? SHEET_RED : SHEET;
    if (!p.alive) { if (Math.floor(p.deathT / 3) % 2) continue; sheet = SHEET_FLASH; }
    spr(sheet, a.f[fr], p.x, p.y - 8, 2, 3, a.flip[fr]);
  }  // timer, centred on the top wall
  if (mode) {
    const secs = Math.ceil(G.time / 60), txt = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
    const low = G.time <= STRESS_TIME, blink = G.time <= 10*60 && G.time > 0 && Math.floor(G.time / 15) % 2;
    ctx.fillStyle = "rgba(0,0,0,0.75)"; ctx.fillRect(N*8 - 24, 1, 48, 14);
    ctx.font = "700 12px Silkscreen, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = blink ? PAL[7] : low ? PAL[8] : PAL[10];
    ctx.fillText(txt, N*8, 8.5);
  }
  for (const c of G.confetti) {
    c.y += c.vy; c.x += c.vx; if (c.y > N*16) { c.y = -4; c.x = Math.random()*N*16; }
    ctx.fillStyle = PAL[c.c]; ctx.fillRect(Math.round(c.x), Math.round(c.y), 3, 3);
  }
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now){
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000/60) {
    if (phase === "play" || phase === "roundover") tick();
    acc -= 1000/60;
  }
  if (G) draw();
  requestAnimationFrame(frame);
}

function boot(data){
  mode = data.mode || null; wins = data.wins || [0, 0];
  if (!mode) { mode = "cpu"; newRound(); mode = null; } else newRound();
  renderKeys(); renderHud();
  if (data.mode) { mode = data.mode; document.body.classList.toggle("two", mode === "2p"); phase = "paused"; showOverlay("Paused", "Press P or Esc to keep playing.", null); }
  requestAnimationFrame(frame);
}
document.querySelectorAll("button").forEach(b => b.addEventListener("click", () => b.blur()));
window.claude?.hot?.snapshot?.(() => ({ mode, wins }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

</body></html>
