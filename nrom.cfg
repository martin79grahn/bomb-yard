# NROM-256 (mapper 0): 32 KB PRG-ROM, 8 KB CHR-ROM.
# RAM: $0000-$00FF zero page, $0100-$01FF CPU stack, $0200-$02FF OAM shadow,
# $0300-$06FF C globals, $0700-$07FF C software stack.
MEMORY {
    ZP:      start = $0000, size = $0100, type = rw, define = yes;
    HEADER:  start = $0000, size = $0010, file = %O, fill = yes;
    ROM:     start = $8000, size = $7FFA, file = %O, fill = yes, define = yes;
    VECTORS: start = $FFFA, size = $0006, file = %O, fill = yes;
    CHR:     start = $0000, size = $2000, file = %O, fill = yes;
    RAM:     start = $0300, size = $0400, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    HEADER:   load = HEADER,  type = ro;
    STARTUP:  load = ROM,     type = ro, define = yes;
    LOWCODE:  load = ROM,     type = ro, optional = yes;
    ONCE:     load = ROM,     type = ro, optional = yes;
    CODE:     load = ROM,     type = ro, define = yes;
    RODATA:   load = ROM,     type = ro, define = yes;
    DATA:     load = ROM, run = RAM, type = rw, define = yes;
    BSS:      load = RAM,     type = bss, define = yes;
    VECTORS:  load = VECTORS, type = ro;
    CHARS:    load = CHR,     type = ro;
}
